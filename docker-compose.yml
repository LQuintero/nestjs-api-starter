services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestjs_api_starter
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nestjs_api_starter']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nestjs_api_starter?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-at-least-32-characters
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      IDEMPOTENCY_TTL_SECONDS: 86400
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: change-me-password
      SEED_ADMIN_NAME: Admin
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
